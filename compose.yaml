# Yerel geliştirme ortamı. Başlatmak için: docker compose up -d
# Değerler .env dosyasından okunur (.env.example dosyasını kopyalayın).
name: sahahub
services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: ${DB_NAME:-sahahub}
      POSTGRES_USER: ${DB_USER:-sahahub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD .env dosyasinda tanimlanmali}
      TZ: UTC
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18 imaji veriyi /var/lib/postgresql/18/docker altinda tutar
      - sahahub-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sahahub} -d ${DB_NAME:-sahahub}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Test e-posta sunucusu: gercek gonderim yapmaz. Arayuz: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.3
    ports:
      - "${MAIL_SMTP_PORT:-1025}:1025"
      - "${MAIL_UI_PORT:-8025}:8025"

volumes:
  sahahub-pgdata:

<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="messages">
	<div class="alert alert-success" role="status" th:if="${flashSuccess}">
		<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7" fill="none" stroke="currentColor" stroke-width="2"/></svg>
		<span th:text="${flashSuccess}">Kaydedildi.</span>
	</div>
	<div class="alert alert-warning" role="status" th:if="${flashWarning}">
		<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5l7 13H1z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 6v4M8 11.5v1.5" stroke="currentColor" stroke-width="1.8"/></svg>
		<span th:text="${flashWarning}">Dikkat.</span>
	</div>
	<div class="alert alert-error" role="alert" th:if="${flashError}">
		<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 4v5M8 11v1.5" stroke="currentColor" stroke-width="1.8"/></svg>
		<span th:text="${flashError}">Hata.</span>
	</div>
</th:block>
<th:block th:fragment="empty"></th:block>
</body>
</html>

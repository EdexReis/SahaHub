<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, ~{::main}, 'customer')}">
<head><title th:text="${d.name()} + (${d.knockout()} ? ' · Turnuva' : ' · Lig') + ' · SahaHub'">Lig · SahaHub</title></head>
<body>
<main id="main" class="page">
	<p class="small" style="margin-bottom:8px"><a th:href="@{/ligler}">← Ligler</a></p>
	<div class="page-head">
		<div style="min-width:0">
			<p class="eyebrow" th:text="${d.businessName()} + ' · ' + ${d.branchName()} + ' · ' + ${d.format().label()}">İşletme · Şube</p>
			<h1 th:text="${d.name()}">Kış Ligi</h1>
		</div>
		<span class="status" th:classappend="${d.active()} ? 'status-CONFIRMED' : 'status-COMPLETED'" th:text="${d.status().label()}">Sürüyor</span>
	</div>
	<div class="league-grid" th:classappend="${d.knockout()} ? 'is-cup'">
		<section aria-labelledby="st-title" th:unless="${d.knockout()}">
			<h2 id="st-title" class="section-title">Puan durumu</h2>
			<div th:replace="~{tournament/parts :: standings(${d})}"></div>
		</section>
		<section aria-labelledby="bk-title" th:if="${d.knockout()}">
			<h2 id="bk-title" class="section-title">Eşleşme ağacı</h2>
			<div th:replace="~{tournament/parts :: bracket(${d})}"></div>
		</section>
		<section aria-labelledby="fx-title">
			<h2 id="fx-title" class="section-title" th:text="${d.knockout()} ? 'Maçlar' : 'Fikstür'">Fikstür</h2>
			<div th:replace="~{tournament/parts :: fixture(${d})}"></div>
		</section>
	</div>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" th:fragment="page(title, content, area)">
<!-- Hata sayfalarında @ModelAttribute tavsiyeleri çalışmaz: me ve currentPath boş olabilir. -->
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="htmx-config" content='{"includeIndicatorStyles":false}'>
	<title th:replace="${title}">SahaHub</title>
	<link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml">
	<link rel="stylesheet" th:href="@{/css/app.css}">
	<script th:src="@{/vendor/htmx-2.0.11.min.js}" defer></script>
	<script th:src="@{/js/app.js}" defer></script>
</head>
<body th:classappend="${area == 'staff'} ? 'wide'">
	<a class="skip-link" href="#main">İçeriğe geç</a>
	<header class="topbar">
		<div class="topbar-inner">
			<a class="brand" th:href="@{/}" aria-label="SahaHub ana sayfa">
				<svg class="brand-mark" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="3" width="20" height="16" rx="1.5" fill="none" stroke="#17804A" stroke-width="2"/><path d="M11 3v16" stroke="#fff" stroke-width="1.5"/><circle cx="11" cy="11" r="3" fill="none" stroke="#fff" stroke-width="1.5"/></svg>
				<span class="brand-text">SahaHub</span>
			</a>
			<nav class="nav" aria-label="Ana menü">
				<a th:href="@{/sahalar}" th:aria-current="${currentPath != null and (currentPath == '/' or #strings.startsWith(currentPath, '/sahalar'))} ? 'page'">Sahalar</a>
				<a th:if="${me != null}" th:href="@{/rezervasyonlarim}" th:aria-current="${currentPath != null and #strings.startsWith(currentPath, '/rezervasyon')} ? 'page'"><span class="long">Rezervasyonlarım</span><span class="short">Rezervasyonlar</span></a>
				<a th:href="@{/ilanlar}" th:classappend="${me != null and me.staff()} ? 'hide-sm'"
				   th:aria-current="${currentPath != null and (#strings.startsWith(currentPath, '/ilanlar') or #strings.startsWith(currentPath, '/takimlar') or #strings.startsWith(currentPath, '/ligler') or #strings.startsWith(currentPath, '/davet'))} ? 'page'">İlanlar</a>
				<a th:if="${me != null}" th:href="@{/bildirimler}" th:aria-current="${currentPath != null and (#strings.startsWith(currentPath, '/bildirimler') or #strings.startsWith(currentPath, '/profil'))} ? 'page'"
				   th:aria-label="${unreadCount != null and unreadCount > 0} ? 'Bildirimler, ' + ${unreadCount} + ' okunmamış' : 'Bildirimler'">
					<span class="long">Bildirimler</span>
					<svg class="short nav-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.5a5 5 0 0 0-5 5v3.2L3.5 13.5h13L15 10.7V7.5a5 5 0 0 0-5-5Zm-2 13a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
					<span class="nav-count num" th:if="${unreadCount != null and unreadCount > 0}" th:text="${unreadCount > 99} ? '99+' : ${unreadCount}">2</span>
				</a>
				<a th:if="${me != null and me.staff()}" class="nav-staff" th:href="@{/isletme}" th:aria-current="${currentPath != null and #strings.startsWith(currentPath, '/isletme')} ? 'page'"><span class="long">İşletme paneli</span><span class="short">Panel</span></a>
				<a th:if="${me != null and me.platformAdmin()}" class="hide-sm" th:href="@{/admin/isletmeler}">Platform</a>
				<a th:if="${me == null}" th:href="@{/giris}">Giriş</a>
				<a th:if="${me == null}" class="hide-sm" th:href="@{/kayit}">Kayıt ol</a>
				<form th:if="${me != null}" th:action="@{/cikis}" method="post">
					<button type="submit" th:title="${me.fullName()}">Çıkış</button>
				</form>
			</nav>
		</div>
	</header>
	<div id="flash-area" class="flash-area" aria-live="polite"><th:block th:replace="~{fragments/flash :: messages}"/></div>
	<th:block th:replace="${content}"/>
	<footer class="footer" th:if="${area != 'staff'}">
		SahaHub · Çevrim içi ödeme bu sürümde bir simülasyondur; kart bilgisi alınmaz, gerçek para çekilmez.
	</footer>
</body>
</html>
